<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Filter for soft drop shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#003566" flood-opacity="0.3"/>
    </filter>
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with the exact official blue hue -->
  <rect width="600" height="400" rx="16" fill="#0072b2"/>

  <g transform="translate(300, 180)" text-anchor="middle" filter="url(#logoShadow)">

    <!-- TOP THEME PARK GRAPHICS -->
    <g transform="translate(0, -95)">
      <!-- Green wave ribbon path -->
      <path d="M-105,42 C-70,25 -20,50 30,35 C65,22 105,40 120,44" fill="none" stroke="#48a23f" stroke-width="8" stroke-linecap="round"/>
      <path d="M-90,46 C-50,30 -5,54 45,39 C75,28 110,43 125,47" fill="none" stroke="#f6a623" stroke-width="4" stroke-linecap="round"/>

      <!-- 1. Ferris Wheel (Purple) on the left -->
      <g transform="translate(-52, 0)">
        <!-- Wheel base stands -->
        <line x1="0" y1="0" x2="-22" y2="44" stroke="#7b3f94" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="22" y2="44" stroke="#7b3f94" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Main Wheel Rim Outer & Inner -->
        <circle cx="0" cy="0" r="26" fill="none" stroke="#7b3f94" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="#7b3f94" stroke-width="2"/>
        <circle cx="0" cy="0" r="4" fill="#7b3f94"/>
        <!-- Spokes -->
        <line x1="0" y1="-26" x2="0" y2="26" stroke="#7b3f94" stroke-width="1.8"/>
        <line x1="-26" y1="0" x2="26" y2="0" stroke="#7b3f94" stroke-width="1.8"/>
        <line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4" stroke="#7b3f94" stroke-width="1.8"/>
        <line x1="-18.4" y1="18.4" x2="18.4" y2="-18.4" stroke="#7b3f94" stroke-width="1.8"/>
        <!-- Gondolas / Cabins -->
        <circle cx="0" cy="-26" r="3" fill="#fdb813"/>
        <circle cx="26" cy="0" r="3" fill="#e73887"/>
        <circle cx="0" cy="26" r="3" fill="#fdb813"/>
        <circle cx="-26" cy="0" r="3" fill="#e73887"/>
        <circle cx="18.4" cy="-18.4" r="3" fill="#48a23f"/>
        <circle cx="18.4" cy="18.4" r="3" fill="#fdb813"/>
        <circle cx="-18.4" cy="18.4" r="3" fill="#48a23f"/>
        <circle cx="-18.4" cy="-18.4" r="3" fill="#fdb813"/>
      </g>

      <!-- 2. Carousel / Canopy Tent (Teal/Mint) in middle -->
      <g transform="translate(10, 10)">
        <!-- Canopy Roof -->
        <path d="M0,-24 L-28,4 L28,4 Z" fill="none" stroke="#4dbd99" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M0,-24 L-12,4 M0,-24 L12,4" stroke="#4dbd99" stroke-width="2"/>
        <!-- Flag on top -->
        <line x1="0" y1="-24" x2="0" y2="-32" stroke="#4dbd99" stroke-width="2"/>
        <polygon points="0,-32 10,-28 0,-24" fill="#fdb813"/>
        <!-- Poles and lights base -->
        <line x1="-22" y1="4" x2="-22" y2="28" stroke="#4dbd99" stroke-width="2.5"/>
        <line x1="-10" y1="4" x2="-10" y2="28" stroke="#4dbd99" stroke-width="2.5"/>
        <line x1="10" y1="4" x2="10" y2="28" stroke="#4dbd99" stroke-width="2.5"/>
        <line x1="22" y1="4" x2="22" y2="28" stroke="#4dbd99" stroke-width="2.5"/>
        <line x1="-26" y1="28" x2="26" y2="28" stroke="#4dbd99" stroke-width="3"/>
        <!-- Little light bulbs -->
        <circle cx="-22" cy="32" r="2.5" fill="#fdb813"/>
        <circle cx="-10" cy="32" r="2.5" fill="#fdb813"/>
        <circle cx="10" cy="32" r="2.5" fill="#fdb813"/>
        <circle cx="22" cy="32" r="2.5" fill="#fdb813"/>
      </g>

      <!-- 3. Roller Coaster Track Loop (Gold/Orange) on the right -->
      <g transform="translate(68, 6)">
        <path d="M-10,36 C-2,30 2,10 12,-4 C22,-18 36,-14 36,4 C36,24 16,36 -2,38 C-20,40 -25,20 -15,4 C-5,-12 15,-28 32,-15" 
              fill="none" stroke="#f6a623" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Track cross ties -->
        <line x1="10" y1="-2" x2="16" y2="4" stroke="#f6a623" stroke-width="1.8"/>
        <line x1="22" y1="-12" x2="28" y2="-6" stroke="#f6a623" stroke-width="1.8"/>
        <line x1="32" y1="2" x2="38" y2="8" stroke="#f6a623" stroke-width="1.8"/>
      </g>
    </g>

    <!-- BOLD CLOUD WHITE OUTLINE FOR "PRELAN" & "JUNIOR SCHOOL" -->
    <!-- Background white cloud container for bubbly typography -->
    <path d="
      M -200, -30
      C -220, -50 -200, -75 -170, -75
      C -155, -85 -125, -88 -105, -75
      C -85, -88 -45, -88 -25, -75
      C -5, -88 35, -88 55, -75
      C 75, -88 115, -88 135, -75
      C 165, -80 205, -55 195, -20
      C 215, 0 215, 30 195, 45
      C 205, 65 195, 95 160, 95
      C 130, 105 80, 105 50, 95
      C 20, 105 -30, 105 -60, 95
      C -100, 105 -150, 100 -175, 80
      C -205, 75 -215, 40 -195, 15
      C -215, 0 -215, -15 -200, -30 Z
    " fill="#ffffff" filter="url(#cloudGlow)"/>

    <!-- WORD 1: "Prelan" (Bubbly, Colorful, Stars inside P and a) -->
    <g transform="translate(0, -10)" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="94" letter-spacing="-2">
      <!-- P (Sky Blue #2a79c5) with White Star -->
      <text x="-155" y="0" fill="#2a79c5">P</text>
      <!-- Star inside P -->
      <polygon points="-146,-48 -143,-40 -134,-40 -141,-35 -138,-27 -146,-32 -154,-27 -151,-35 -158,-40 -149,-40" fill="#ffffff"/>

      <!-- r (Magenta/Pink #e73282) -->
      <text x="-92" y="0" fill="#e73282">r</text>

      <!-- e (Bright Lime/Green #80c342) -->
      <text x="-48" y="0" fill="#80c342">e</text>

      <!-- l (Yellow/Gold #fdb913) -->
      <text x="2" y="0" fill="#fdb913">l</text>

      <!-- a (Royal Purple #6e328e) with White Star -->
      <text x="46" y="0" fill="#6e328e">a</text>
      <!-- Star inside a -->
      <polygon points="56,-42 59,-35 67,-35 61,-30 63,-23 56,-27 49,-23 51,-30 45,-35 53,-35" fill="#ffffff"/>

      <!-- n (Red #c1202f) -->
      <text x="110" y="0" fill="#c1202f">n</text>
    </g>

    <!-- WORD 2: "Junior School" -->
    <g transform="translate(0, 68)" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <!-- Junior (Crimson Red #e82128) -->
      <text x="-64" y="0" fill="#e82128">Junior</text>
      <!-- School (Fresh Green #48a23f) -->
      <text x="68" y="0" fill="#48a23f">School</text>
    </g>

  </g>

  <!-- MOTTO: "Soaring To Excellence" (White Serif Text) -->
  <text x="300" y="348" text-anchor="middle" fill="#ffffff" font-family="'Georgia', 'Times New Roman', serif" font-size="34" font-weight="normal" letter-spacing="1.5">
    Soaring To Excellence
  </text>
</svg>
